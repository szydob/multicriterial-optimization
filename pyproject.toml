[project]
name = "owd"
version = "0.1.0"
description = "Optymalizacja wielokryterialna dyskretna — punkty niezdominowane (Pareto), benchmark i Streamlit"
readme = "README.md"
authors = [
    { name = "Szymon Dobrowolski", email = "szydob1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.24",
]


[project.scripts]
owd = "owd.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=8.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
